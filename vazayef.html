<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>وظایف صبح — فروشگاه دوچرخه چی</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: "Vazirmatn", "Vazirmatn Medium", "Vazirmatn Bold", sans-serif;
    background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
    min-height: 100vh;
    color: #1e3a5f;
  }
  .topbar {
    height: 12px;
    background: linear-gradient(90deg, #0f2d5c, #1e40af, #3b82f6);
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  .header h1 {
    color: #1e3a8a;
    font-size: 28px;
    margin: 0 0 6px;
  }
  .header p {
    color: #3b82f6;
    font-weight: bold;
    margin: 0 0 4px;
  }
  .header .date {
    color: #6b7280;
    font-size: 13px;
  }
  .card {
    background: #ffffff;
    border: 1px solid #bfdbfe;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(30, 64, 175, 0.08);
    margin-bottom: 14px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .card .num {
    background: #1e40af;
    color: #ffffff;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    flex-shrink: 0;
  }
  .card .task {
    flex: 1;
    font-size: 17px;
    font-weight: bold;
    color: #1e3a8a;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn {
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    background: #f3f4f6;
    color: #374151;
    transition: all 0.15s ease;
    user-select: none;
  }
  .btn.done {
    background: #ffffff;
    border-color: #bfdbfe;
  }
  .btn.done.active {
    background: #dcfce7;
    border-color: #22c55e;
    color: #15803d;
  }
  .btn.notdone {
    background: #ffffff;
    border-color: #bfdbfe;
  }
  .btn.notdone.active {
    background: #fee2e2;
    border-color: #ef4444;
    color: #b91c1c;
  }
  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
  }
  .toolbar .btn {
    background: #1e40af;
    color: #ffffff;
    border: none;
    padding: 12px 26px;
    font-size: 15px;
  }
  .toolbar .btn.secondary {
    background: #e5edfb;
    color: #1e3a8a;
  }
  .summary {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #1e3a8a;
    font-weight: bold;
  }
  @media print {
    body { background: #ffffff; }
    .toolbar { display: none; }
    .topbar { height: 8px; }
    .container { padding: 10px 0; }
    .card { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>
<body>
  <div class="topbar"></div>
  <div class="container">
    <div class="header">
      <h1>وظایف صبح</h1>
      <p>فروشگاه دوچرخه چی</p>
      <div class="date" id="today"></div>
    </div>

    <div id="list"></div>

    <div class="summary" id="summary"></div>

    <div class="toolbar">
      <button class="btn" onclick="resetAll()">شروع دوباره</button>
      <button class="btn secondary" onclick="window.print()">پرینت / ذخیره PDF</button>
    </div>
  </div>

<script>
  const tasks = [
    "روشن کردن برق‌ها",
    "تی و جارو",
    "چک کردن کسری‌ها",
    "روشن کردن کولرها",
    "روشن کردن سیستم",
    "گذاشتن آب جوش",
    "چک کردن آب کولرها",
    "موزیک گذاشتن و روشن کردن"
  ];

  const list = document.getElementById("list");

  function render() {
    list.innerHTML = "";
    tasks.forEach((t, i) => {
      const saved = localStorage.getItem("vazayef-" + i) || "";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="num">${faNum(i + 1)}</div>
        <div class="task">${t}</div>
        <div class="actions">
          <button class="btn done ${saved === "done" ? "active" : ""}" onclick="setStatus(${i},'done')">انجام دادم</button>
          <button class="btn notdone ${saved === "notdone" ? "active" : ""}" onclick="setStatus(${i},'notdone')">انجام ندادم</button>
        </div>`;
      list.appendChild(card);
    });
    updateSummary();
  }

  function setStatus(i, status) {
    localStorage.setItem("vazayef-" + i, status);
    render();
  }

  function resetAll() {
    tasks.forEach((_, i) => localStorage.removeItem("vazayef-" + i));
    render();
  }

  function updateSummary() {
    const done = tasks.filter((_, i) => localStorage.getItem("vazayef-" + i) === "done").length;
    document.getElementById("summary").textContent =
      `تکمیل‌شده: ${faNum(done)} از ${faNum(tasks.length)}`;
  }

  function faNum(n) {
    return String(n).replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
  }

  document.getElementById("today").textContent = new Date().toLocaleDateString("fa-IR");
  render();
</script>
</body>
</html>
